<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Familiares - Multiusuario</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .card { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        .transaction-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Finanzas Familiares Colaborativas</h2>

    <!-- SECCIÓN DE AUTENTICACIÓN -->
    <div id="auth-section">
        <div id="login-box">
            <h3>Iniciar Sesión</h3>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" onclick="toggleAuth(true)">Regístrate</a></p>
        </div>

        <div id="register-box" class="hidden">
            <h3>Registro de Usuario</h3>
            <input type="text" id="reg-name" placeholder="Tu Nombre">
            <input type="email" id="reg-email" placeholder="Correo electrónico">
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <button onclick="register()">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" onclick="toggleAuth(false)">Inicia sesión</a></p>
        </div>
    </div>

    <!-- SECCIÓN DE PANEL PRINCIPAL -->
    <div id="dashboard-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="welcome-msg">Bienvenido</h3>
            <button onclick="logout()" style="width: auto; padding: 6px 12px; background: #ef4444;">Cerrar Sesión</button>
        </div>

        <!-- Gestión de Familia -->
        <div class="card" id="family-setup">
            <h4>Configuración de Familia</h4>
            <div id="no-family">
                <input type="text" id="family-name" placeholder="Nombre de la Familia (ej. Los Pérez)">
                <button onclick="createFamily()">Crear Familia</button>
                <hr>
                <input type="text" id="family-code-input" placeholder="Código de Familia existente">
                <button onclick="joinFamily()">Unirse a Familia</button>
            </div>
            <div id="has-family" class="hidden">
                <p><strong>Familia:</strong> <span id="display-family-name"></span></p>
                <p><strong>Código para invitar:</strong> <code id="display-family-code" style="background:#e2e8f0; padding:2px 6px; border-radius:4px;"></code></p>
            </div>
        </div>

        <!-- Panel de Finanzas (Visible solo con familia) -->
        <div id="finance-panel" class="hidden">
            <div class="card">
                <h4>Registrar Movimiento / Aporte</h4>
                <label>Tipo:</label>
                <select id="tx-type">
                    <option value="ingreso">Ingreso / Aporte a familiar</option>
                    <option value="gasto">Gasto familiar</option>
                </select>
                <input type="number" id="tx-amount" placeholder="Monto en USD (ej. 20)">
                <input type="text" id="tx-desc" placeholder="Descripción (ej. Mesada de papá)">
                <button onclick="addTransaction()">Registrar Transacción</button>
            </div>

            <div class="card">
                <h4>Movimientos de la Familia</h4>
                <div id="transactions-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Base de datos simulada en localStorage
    let db = JSON.parse(localStorage.getItem('family_finance_db')) || { users: [], families: [], transactions: [] };
    let currentUser = JSON.parse(sessionStorage.getItem('current_user')) || null;

    function saveDB() {
        localStorage.setItem('family_finance_db', JSON.stringify(db));
    }

    function toggleAuth(toRegister) {
        document.getElementById('login-box').classList.toggle('hidden', toRegister);
        document.getElementById('register-box').classList.toggle('hidden', !toRegister);
    }

    function register() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;

        if(!name || !email || !pass) return alert("Completa todos los campos");
        if(db.users.find(u => u.email === email)) return alert("El correo ya está registrado");

        const newUser = { id: 'u_' + Date.now(), name, email, pass, familyId: null };
        db.users.push(newUser);
        saveDB();
        alert("¡Registro exitoso! Ahora inicia sesión.");
        toggleAuth(false);
    }

    function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        
        const user = db.users.find(u => u.email === email && u.pass === pass);
        if(!user) return alert("Credenciales incorrectas");

        currentUser = user;
        sessionStorage.setItem('current_user', JSON.stringify(currentUser));
        checkSession();
    }

    function logout() {
        currentUser = null;
        sessionStorage.removeItem('current_user');
        checkSession();
    }

    function checkSession() {
        if(currentUser) {
            // Refrescar datos del usuario desde la db
            currentUser = db.users.find(u => u.id === currentUser.id);
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Hola, ${currentUser.name}`;
            updateFamilyUI();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    }

    function createFamily() {
        const fname = document.getElementById('family-name').value;
        if(!fname) return alert("Escribe un nombre para la familia");

        const familyId = 'f_' + Date.now();
        const code = Math.random().toString(36.substring(2, 8)).toUpperCase();
        
        db.families.push({ id: familyId, name: fname, code: code });
        currentUser.familyId = familyId;
        
        // Actualizar usuario en la BD
        db.users = db.users.map(u => u.id === currentUser.id ? currentUser : u);
        saveDB();
        updateFamilyUI();
    }

    function joinFamily() {
        const code = document.getElementById('family-code-input').value.trim().toUpperCase();
        const family = db.families.find(f => f.code === code);
        
        if(!family) return alert("Código de familia no encontrado");

        currentUser.familyId = family.id;
        db.users = db.users.map(u => u.id === currentUser.id ? currentUser : u);
        saveDB();
        updateFamilyUI();
    }

    function updateFamilyUI() {
        const noFamilyDiv = document.getElementById('no-family');
        const hasFamilyDiv = document.getElementById('has-family');
        const financePanel = document.getElementById('finance-panel');

        if(currentUser.familyId) {
            noFamilyDiv.classList.add('hidden');
            hasFamilyDiv.classList.remove('hidden');
            financePanel.classList.remove('hidden');

            const family = db.families.find(f => f.id === currentUser.familyId);
            document.getElementById('display-family-name').innerText = family.name;
            document.getElementById('display-family-code').innerText = family.code;
            renderTransactions();
        } else {
            noFamilyDiv.classList.remove('hidden');
            hasFamilyDiv.classList.add('hidden');
            financePanel.classList.add('hidden');
        }
    }

    function addTransaction() {
        const type = document.getElementById('tx-type').value;
        const amount = parseFloat(document.getElementById('tx-amount').value);
        const desc = document.getElementById('tx-desc').value;

        if(!amount || !desc) return alert("Rellena todos los campos de la transacción");

        const newTx = {
            id: 'tx_' + Date.now(),
            familyId: currentUser.familyId,
            userId: currentUser.id,
            userName: currentUser.name,
            type,
            amount,
            desc,
            date: new Date().toLocaleDateString()
        };

        db.transactions.push(newTx);
        saveDB();
        
        document.getElementById('tx-amount').value = '';
        document.getElementById('tx-desc').value = '';
        renderTransactions();
    }

    function renderTransactions() {
        const list = document.getElementById('transactions-list');
        const familyTxs = db.transactions.filter(t => t.familyId === currentUser.familyId);

        if(familyTxs.length === 0) {
            list.innerHTML = '<p style="color: #64748b;">No hay movimientos registrados todavía.</p>';
            return;
        }

        list.innerHTML = familyTxs.reverse().map(t => `
            <div class="transaction-item">
                <div>
                    <strong>${t.userName}</strong>: ${t.desc} <br>
                    <small style="color:#64748b;">${t.date}</small>
                </div>
                <div style="color: ${t.type === 'ingreso' ? '#16a34a' : '#dc2626'}; font-weight: bold;">
                    ${t.type === 'ingreso' ? '+' : '-'}$${t.amount.toFixed(2)}
                </div>
            </div>
        `).join('');
    }

    // Inicializar al cargar
    checkSession();
</script>

</body>
</html>
